services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zeus
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: ${ZEUS_DB_PASSWORD:?Set ZEUS_DB_PASSWORD in the environment file}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zeus", "-d", "zeus"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  hub:
    build:
      context: ../services/zeus_hub
    environment:
      DATABASE_URL: postgresql://zeus:${ZEUS_DB_PASSWORD:?Set ZEUS_DB_PASSWORD in the environment file}@postgres:5432/zeus
      HUB_INVITE_CODE: ${HUB_INVITE_CODE:-}
      HUB_ALLOWED_ORIGINS: ${HUB_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${ZEUS_HUB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  postgres:
