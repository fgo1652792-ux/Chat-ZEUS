name: zeus_chat
description: A local-first, multi-provider AI chat app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0
  markdown: ^7.3.1
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  pdfrx: 3.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  uuid: ^4.6.0
  share_plus: ^13.3.1
  sqflite: ^2.4.6
  sqflite_common: ^2.5.17
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.2
  ui:
    path: ../../packages/zeus_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/zeus.png
  shaders:
    - shaders/liquid_glass.frag
