name: Zeus Chat | Platform Builds
on:
  workflow_dispatch:
  push:
    branches: [main, feature/zeus-chat-complete]
    paths:
      - apps/**
      - packages/**
      - .github/workflows/zeus-platform-builds.yml
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            runner: ubuntu-latest
          - platform: android
            runner: ubuntu-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/zeus_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Restore app dependencies
        run: flutter pub get
      - name: Build Web
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          dart run sqflite_common_ffi_web:setup
          flutter build web --release
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -C build/web -czf "${GITHUB_WORKSPACE}/dist/ZeusChat-web.tar.gz" .
      - name: Build Android APK and AAB
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "${GITHUB_WORKSPACE}/dist/ZeusChat-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "${GITHUB_WORKSPACE}/dist/ZeusChat-android.aab"
      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -C build/linux/x64/release/bundle -czf "${GITHUB_WORKSPACE}/dist/ZeusChat-linux.tar.gz" .
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          apps=(build/macos/Build/Products/Release/*.app)
          test -d "${apps[0]}"
          ditto -c -k --keepParent "${apps[0]}" "${GITHUB_WORKSPACE}/dist/ZeusChat-macos.zip"
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/dist" -Force
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:GITHUB_WORKSPACE/dist/ZeusChat-windows.zip"
      - name: Write build checksums
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          python - <<'PYTHON'
          from hashlib import file_digest
          from pathlib import Path

          with Path("SHA256SUMS.txt").open("w") as out:
              for path in sorted(Path(".").glob("ZeusChat-*")):
                  with path.open("rb") as artifact:
                      checksum = file_digest(artifact, "sha256").hexdigest()
                  print(f"{checksum}  {path.name}", file=out)
          PYTHON
          echo "Source SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ZeusChat-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
