name: Zeus Chat | Hub Quality
on:
  workflow_dispatch:
  push:
    branches: [main, feature/zeus-chat-complete]
    paths: ['services/zeus_hub/**', 'infra/**', '.github/workflows/zeus-hub-quality.yml']
  pull_request:
    paths: ['services/zeus_hub/**', 'infra/**', '.github/workflows/zeus-hub-quality.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fixture_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture_only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: services/zeus_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/zeus_hub/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
